[package]
name = "hello"
version = "0.1.0"
edition = "2021"
description = "Hello-world Lambda using the rate-limit middleware from the workspace's `library` crate"

[dependencies]
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "1"
lambda_http = "1"
rust-lambda-middleware-example = { path = "../../library" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.6", features = ["cors"] }
