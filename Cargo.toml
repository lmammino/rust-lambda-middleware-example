[package]
name = "rust-lambda-middleware-example"
version = "0.1.0"
edition = "2021"
description = "Companion code for the blog post 'Writing middlewares for Rust Lambda functions' (loige.co)"

[[bin]]
name = "hello"
path = "src/main.rs"

[dependencies]
lambda_http = "0.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "1"
